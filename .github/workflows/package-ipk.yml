name: Package LG webOS IPK

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: Release reference or approved checkpoint
        required: true
        type: string
      debug_package:
        description: Create an unminified package for TV debugging
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Build IPK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source and manifest
        run: node scripts/validate-webos.mjs
      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli
      - name: Package IPK
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ inputs.debug_package }}" = "true" ]; then
            ares-package --no-minify --outdir dist .
          else
            ares-package --outdir dist .
          fi
          ares-package --info dist/*.ipk
      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELVANOQ-Play-LG-${{ github.sha }}
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 30
