name: Package LG webOS IPK

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: Release reference or approved checkpoint
        required: true
        type: string
      debug_package:
        description: Create an unminified package for TV debugging
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Build IPK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          # não deixa o token do GitHub gravado em .git/config
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source and manifest
        run: node scripts/validate-webos.mjs
      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli
      - name: Stage app files
        shell: bash
        # Empacota só o que o app usa. Nunca a pasta do repositório inteira:
        # .git, .github, testes, scripts e documentos não vão para a TV/loja.
        run: |
          rm -rf build && mkdir -p build/app
          cp -R appinfo.json index.html icon.png largeIcon.png splash.png css fonts images src build/app/
      - name: Package IPK
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ inputs.debug_package }}" = "true" ]; then
            ares-package --no-minify --outdir dist build/app
          else
            ares-package --outdir dist build/app
          fi
          ares-package --info dist/*.ipk
      - name: Check IPK contents
        shell: bash
        run: |
          mkdir -p build/ipk && cd build/ipk && ar x ../../dist/*.ipk && tar -tzf data.tar.gz > ../files.txt
          if grep -E '/(\.git|\.github|tests|scripts|dist|build)(/|$)|\.md$' ../files.txt; then
            echo "::error::O IPK contém arquivos que não devem ir para a loja"; exit 1
          fi
          echo "Arquivos no IPK: $(grep -vc '/$' ../files.txt)"
      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELVANOQ-Play-LG-${{ github.sha }}
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 30
