name: webOS validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate webOS source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate source and manifest
        run: node scripts/validate-webos.mjs
      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli
      - name: Check package manifest without generating IPK
        run: ares-package --check .
